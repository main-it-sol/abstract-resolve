@if (errorMessage()) {
  <p role="alert">{{ errorMessage() }}</p>
  <button type="button" (click)="reload()">Retry loading</button>
}
<div [attr.aria-busy]="loading()">
  <ag-grid-angular
    class="ag-theme-quartz"
    [style.height.px]="gridHeight()"
    style="width:100%"
    [rowHeight]="50"
    [pagination]="true"
    [rowData]="rowData()"
    [loading]="loading()"
    [defaultColDef]="defaultColDef"
    [enableCellTextSelection]="true"
    [columnDefs]="source().columns"
    [rowStyle]="source().rowStyle"
    (gridReady)="onGridReady($event)"
  />
</div>
