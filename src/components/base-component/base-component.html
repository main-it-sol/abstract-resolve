
<div>
  <h1>
    {{concreteClass.moduleName}}
  </h1>
  
</div>
<app-menu-component [concreteClass]="concreteClass" [gridApi]="gridApi" />

@if (errorMessage()) {
  <p role="alert">{{ errorMessage() }}</p>
}

<!-- The AG Grid component -->
<div [attr.aria-busy]="loading()">
  <ag-grid-angular
  id="agGrid"
  #agGrid
  class="ag-theme-quartz"
  [rowHeight]="concreteClass.rowHeight"
  [style]="concreteClass.style"
  [pagination]=true
  [rowData]="rowData"
  [loading]="loading()"
  [defaultColDef]="concreteClass.defaultColDef"
  [enableCellTextSelection]="true"
  [columnDefs]="colDefs"
  [getRowStyle]="concreteClass.getRowStyle"
  (gridReady)="onGridReady($event)"
  >
  </ag-grid-angular>
</div>
